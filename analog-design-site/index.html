<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>analog design</title>
<meta name="description" content="analog design — a small design studio. Apps, and sometimes objects.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; color: #000; }
  body {
    font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
  }
  main { flex: 1; padding: 72px 48px 48px; }

  /* ---- the logo grid ------------------------------------------------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 200px);
    gap: 48px 64px;
  }
  .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 200px;
    height: 200px;
    text-decoration: none;
  }
  .logo img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    opacity: 0.3;
    filter: grayscale(1);
    transition: opacity .25s ease, filter .25s ease;
  }
  .logo:hover img, .logo:focus-visible img { opacity: 1; filter: none; }
  .logo:focus-visible { outline: none; }
  @media (hover: none) { .logo img { opacity: 1; filter: none; } }

  /* per-logo sizing so the marks feel the same visual weight */
  .logo.golfa img { width: 170px; }
  .logo.roam img  { width: 150px; }

  /* ---- wordmark, bottom left ---------------------------------------- */
  footer { padding: 0 48px 48px; }
  .wordmark {
    display: inline-block;
    text-decoration: none;
    font-weight: 900;
    font-size: clamp(26px, 3.6vw, 44px);
    letter-spacing: -0.02em;
    line-height: 1;
    color: #000;
  }
  .wordmark .hollow {
    color: transparent;
    -webkit-text-stroke: 1.5px #000;
    text-stroke: 1.5px #000;
  }

  @media (max-width: 640px) {
    main { padding: 40px 24px 32px; }
    footer { padding: 0 24px 32px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 24px; }
    .logo { width: auto; height: 140px; }
    .logo.golfa img { width: 120px; }
    .logo.roam img  { width: 104px; }
  }
</style>
</head>
<body>
<main>
  <!--
    To add a project: copy one <a class="logo"> block, point it at the
    project's folder and its SVG/PNG, and (optionally) add a width rule
    above so it sits at the same visual weight as the others.
  -->
  <nav class="grid" aria-label="Projects">
    <a class="logo golfa" href="/golfa/" title="golfa..">
      <img src="/golfa/assets/golfer.svg" alt="golfa..">
    </a>
    <a class="logo roam" href="/roam/" title="roam">
      <img src="/roam/sphere.svg" alt="roam">
    </a>
  </nav>
</main>
<footer>
  <a class="wordmark" href="/"><span class="hollow">analog</span> design</a>
</footer>
</body>
</html>
